# Source site definitions
# Each entry maps to a row in the source_sites table on first startup.
# scraper_key must match a key in scrapers/registry.py.
#
# To add a new source:
#   1. Create scrapers/my_source.py (inherit BaseScraper, implement scrape())
#   2. Register it in scrapers/registry.py: "my_key": MyScraper
#   3. Add an entry below and restart the app

sources:
  - name: ClinicalTrials.gov
    url: https://clinicaltrials.gov/api/v2/studies
    scraper_key: clinicaltrials
    enabled: true
    scrape_interval_hours: 12

  - name: Grants.gov
    url: https://apply07.grants.gov/grantsws/rest/opportunities/search/
    scraper_key: grants_gov
    enabled: true
    scrape_interval_hours: 24

  - name: NIH Guide for Grants and Contracts
    url: https://grants.nih.gov/funding/searchguide/
    scraper_key: nih_guide
    enabled: true
    scrape_interval_hours: 24

  - name: SBIR.gov (Industry R&D Solicitations)
    url: https://api.sbir.gov/public/api/solicitations
    scraper_key: sbir_gov
    enabled: true
    scrape_interval_hours: 24

  - name: Wellcome Trust
    url: https://wellcome.org/grant-funding
    scraper_key: wellcome
    enabled: true
    scrape_interval_hours: 48

  - name: Robert Wood Johnson Foundation
    url: https://www.rwjf.org/en/grants/funding-opportunities.html
    scraper_key: rwjf
    enabled: true
    scrape_interval_hours: 48
